<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="4" />
  <circle cx="200" cy="200" r="175" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Ambient Glow Behind Character -->
  <circle cx="200" cy="180" r="110" fill="url(#glowGrad)" />

  <!-- Monogram & Tech Emblem Aura -->
  <g transform="translate(200, 150)">
    <!-- Head / Silhouette -->
    <circle cx="0" cy="-20" r="48" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="3" />
    <!-- Modern Glasses / Visor -->
    <rect x="-32" y="-30" width="64" height="20" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <circle cx="-16" cy="-20" r="6" fill="#38bdf8" opacity="0.8" />
    <circle cx="16" cy="-20" r="6" fill="#38bdf8" opacity="0.8" />
    <line x1="-10" y1="-20" x2="10" y2="-20" stroke="#38bdf8" stroke-width="2" />

    <!-- Shoulders / Torso -->
    <path d="M -75 95 C -75 40, -45 35, 0 35 C 45 35, 75 40, 75 95 Z" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="3" />

    <!-- Hoodie / Collar Detail -->
    <path d="M -30 38 L 0 75 L 30 38" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Code Accent on Chest -->
    <text x="0" y="70" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="14" font-weight="700" fill="#38bdf8">&lt;AT /&gt;</text>
  </g>

  <!-- Decorative Orbiting Code Badges -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="55" height="28" rx="8" fill="#151e32" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <text x="27.5" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">React</text>
  </g>

  <g transform="translate(285, 95)">
    <rect x="0" y="0" width="55" height="28" rx="8" fill="#151e32" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.5" />
    <text x="27.5" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#818cf8">Node</text>
  </g>

  <g transform="translate(290, 260)">
    <rect x="0" y="0" width="60" height="28" rx="8" fill="#151e32" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <text x="30" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Cloud</text>
  </g>

  <g transform="translate(50, 260)">
    <rect x="0" y="0" width="55" height="28" rx="8" fill="#151e32" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.5" />
    <text x="27.5" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#818cf8">C++</text>
  </g>

  <!-- Pulse Status Ring (Online / Available) -->
  <circle cx="300" cy="310" r="16" fill="#10b981" fill-opacity="0.2" />
  <circle cx="300" cy="310" r="10" fill="#10b981" />
  <circle cx="300" cy="310" r="5" fill="#ffffff" />
</svg>
